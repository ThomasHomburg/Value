# Value-Screener Konfiguration
# Alle Schwellenwerte, Gewichte und Plausibilitaetsgrenzen zentral gepflegt
# (keine Magic Numbers im Code).
#
# Einheiten-Konvention (wichtig, siehe Bugfix FCF-Yield x1e6):
#   - FMP-Statements (income/balance/cash-flow) liefern ABSOLUTE Betraege
#     in reportedCurrency (z. B. AAPL revenue = 391035000000 USD).
#   - profile.mktCap liefert die AKTUELLE Marktkapitalisierung in absoluten USD.
#   - Alle Kennzahlen bleiben daher in absoluten Betraegen; Schwellen in _usd
#     sind absolute USD (nicht Mio.). Ratios sind dimensionslos.

data:
  # ROIC: effektiver Steuersatz wird auf tax_rate_min..tax_rate_max begrenzt;
  # ausserhalb (oder bei Vorsteuerverlust) gilt der Normsteuersatz tax_rate_norm.
  # Bei EBIT <= 0 ist NOPAT = EBIT (kein Steuervorteil im Verlustjahr).
  tax_rate_min: 0.0           # effektiver Steuersatz < 0 %  -> Normsteuersatz
  tax_rate_max: 0.35          # effektiver Steuersatz > 35 % -> Normsteuersatz
  tax_rate_norm: 0.21         # Normsteuersatz (US-Koerperschaftsteuer)
  years: 5                    # Historienfenster: 5 Jahre pro Unternehmen
  thin_years: 5               # Kriterium mit weniger Jahren Daten -> "Daten duenn"
  min_points_5y: 3            # Mindestanzahl Datenpunkte fuer 5-Jahres-Kennzahlen
  min_points_3y: 2            # Mindestanzahl Datenpunkte fuer 3-Jahres-Kennzahlen
  min_points_10y: 5           # Mindestanzahl Datenpunkte fuer 10-Jahres-Kennzahlen
  cagr_min_points: 4          # CAGR: 4 Punkte = Wachstum ueber 3 Intervalle (verfuegbare Jahre)
  fcf_pos_min_years: 4        # fcf_positive_years: mindestens 4 verfuegbare Jahre (Anteil daran)
  trend_min_points: 4         # gross_margin_trend: mindestens 4 Punkte (3 Intervalle)

providers:
  # Provider-Auswahl nach Ticker-Suffix (Boersen-Suffix) oder Config.
  default: yfinance           # Fallback, wenn kein Suffix erkannt
  force: ""                   # z. B. "yfinance" erzwingt einen Provider fuer ALLE Ticker
  fmp_when_no_suffix: true    # US-Ticker (ohne Suffix) -> FMP, falls API-Key gesetzt
  suffix_map:                 # Boersen-Suffix -> Provider
    ".DE": yfinance           # Xetra
    ".AS": yfinance           # Amsterdam
    ".PA": yfinance           # Paris
    ".CO": yfinance           # Kopenhagen
    ".L": yfinance            # London
    ".SW": yfinance           # SIX Zuerich
    ".TO": yfinance           # Toronto
    ".HK": yfinance           # Hongkong

filters:
  # Harte Ausschlussfilter (vor dem Scoring). Betraege in absoluten USD.
  min_market_cap_usd: 500000000     # Marktkapitalisierung < 500 Mio. USD
  # v29: Jahre mit tatsaechlichen Werten (nicht Spalten): ein Jahr zaehlt nur,
  # wenn mindestens eine Kernkennzahl (revenue/ebit/net_income/ocf/equity)
  # einen Wert ungleich NaN hat. Leere Spalten zaehlen nicht.
  min_history_years: 4              # weniger als 4 Jahre mit Werten -> Ausschluss
  min_avg_fcf_5y_usd: 0             # Ø-FCF ueber 5 Jahre > 0 (negativ)
  min_equity_usd: 0                 # Eigenkapital < 0 (negativ)
  min_revenue_cagr_5y: -0.03        # Umsatz-CAGR 5 J. < -3 % (Value-Trap-Filter)
  # Hinweis: min_avg_fcf_5y_usd und min_equity_usd vergleichen Statement-Werte
  # (reportedCurrency) mit USD-Schwellen; fuer Nicht-USD-Ticker siehe FX-Modul.
  # CAGR benoetigt min_history_years (5) Punkte = Wachstum ueber 4 Jahre.

criteria:
  # Lineare Interpolation zwischen zero- und full-Schwelle.
  # direction 'higher': mehr ist besser; 'lower': weniger ist besser.
  roic_avg5:
    block: profitability
    weight: 0.25
    direction: higher
    full: 0.35
    zero: 0.08
  roe_avg5:
    block: profitability
    weight: 0.10
    direction: higher
    full: 0.30
    zero: 0.08
  net_debt_ebitda:
    block: stability
    weight: 0.10
    direction: lower
    full: 1.0
    zero: 4.0
  interest_coverage:
    block: stability
    weight: 0.05
    direction: higher
    full: 10.0
    zero: 3.0
  fcf_positive_years:
    # Anteil der Jahre mit FCF > 0 an den VERFUEGBAREN Jahren (mindestens 4).
    # Volle Punkte bei 100 %, null Punkte bei <= 50 % (Anzeige als "x / y").
    block: cashflow
    weight: 0.10
    direction: higher
    full: 1.0
    zero: 0.5
  fcf_margin_avg5:
    block: cashflow
    weight: 0.05
    direction: higher
    full: 0.30
    zero: 0.03
  gross_margin_trend:
    # Steigung der Bruttomarge in Prozentpunkten pro Jahr (Hestoer 5 J.)
    block: moat
    weight: 0.05
    direction: higher
    full: 0.0
    zero: -0.5
  revenue_cagr_5y:
    block: moat
    weight: 0.05
    direction: higher
    full: 0.15
    zero: 0.0
  fcf_yield_sbc_avg3:
    # FCF-Yield nach SBC: (FCF - Aktienverguetung) / Marktkapitalisierung,
    # Durchschnitt der letzten 3 Jahre. Loest den Roh-FCF-Yield im Value-Score ab.
    block: valuation
    weight: 0.30
    direction: higher
    full: 0.08
    zero: 0.02
  mos_base:
    # Margin of Safety (Base) aus dem DCF (valuation/dcf.py):
    # 1 - Kurs / innerer Wert je Aktie (Base). Volle Punkte ab 40 %, null bei <= 0 %.
    block: valuation
    weight: 0.40
    direction: higher
    full: 0.40
    zero: 0.0
  ev_ebit_vs_median:
    block: valuation
    weight: 0.30
    direction: lower
    full: 0.60
    zero: 1.20

  # v28: Sektor-Kriterien (Schritt 7, Industry-basiert, siehe sector_rules).
  # Banken/Versicherer: ROE, P/B, Dividendenrendite statt ROIC/FCF/ND/EBITDA.
  # Zykliker: normalisierter Gewinn (7-J.-Normalisierung). REITs: FFO-Yield.
  roe_avg5_financials:
    block: profitability
    weight: 0.25
    direction: higher
    full: 0.20
    zero: 0.08
  price_to_book:
    block: stability
    weight: 0.10
    direction: lower
    full: 1.0
    zero: 3.0
  dividend_yield:
    block: cashflow
    weight: 0.10
    direction: higher
    full: 0.05
    zero: 0.01
  normalized_earnings:
    block: profitability
    weight: 0.15
    direction: higher
    full: 15.0
    zero: 3.0
  ffo_yield:
    block: valuation
    weight: 0.30
    direction: higher
    full: 0.10
    zero: 0.03

sector_rules:
  # v28 (Schritt 7): Sektorregeln ueber das Feld INDUSTRY, nicht Sector
  # (PYPL, Visa, Mastercard laufen als 'Financial Services', sind aber
  # keine Banken).
  groups:
    financials:
      # Banken & Versicherer: ROE, P/B, Dividendenrendite statt
      # ROIC, FCF, ND/EBITDA.
      industries:
        - Banks - Diversified
        - Banks - Regional
        - Banks - Money Center
        - Insurance - Property & Casualty
        - Insurance - Life
        - Insurance - Diversified
        - Insurance - Reinsurance
        - Insurance - Specialty
        - Insurance - Brokers
        - Capital Markets
        - Asset Management
        - Financial Data & Stock Exchanges
        - Diversified Financial Services
        - Mortgage Finance
    cyclicals:
      # Zykliker (Rohstoffe, Chemie, Stahl, Auto): Gewinne ueber bis zu
      # N Jahre normalisieren, soweit Daten reichen, sonst Flag.
      normalize_years: 7
      industries:
        - Gold
        - Silver
        - Copper
        - Aluminum
        - Steel
        - Coal
        - Uranium
        - Other Industrial Metals & Mining
        - Other Precious Metals & Mining
        - Chemicals
        - Specialty Chemicals
        - Agricultural Inputs
        - Auto Manufacturers
        - Auto Parts
        - Auto & Truck Dealerships
        - Trucking
        - Railroads
        - Oil & Gas Integrated
        - Oil & Gas E&P
        - Oil & Gas Refining & Marketing
        - Oil & Gas Midstream
        - Oil & Gas Equipment & Services
        - Building Products & Equipment
        - Construction Materials
        - Residential Construction
        - Home Improvement Retail
        - Department Stores
        - Discount Stores
        - Apparel Retail
        - Specialty Retail
        - Restaurants
        - Resorts & Casinos
        - Lodging
        - Travel Services
        - Airlines
        - Aerospace & Defense
        - Metal Fabrication
        - Steel & Iron
        - Lumber & Wood Production
        - Paper & Paper Products
        - Packaging & Containers
        - Industrial Gases
        - Integrated Freight & Logistics
        - Marine Shipping
        - Airports & Air Services
        - Electrical Equipment & Parts
        - Specialty Industrial Machinery
        - Industrial Distribution
        - Farm & Heavy Construction Machinery
        - Luxury Goods
        - Internet Retail
        - Recreational Vehicles
        - Entertainment
        - Advertising Agencies
        - Rental & Leasing Services
    reits:
      # REITs: FFO-Hinweis statt FCF-Yield (FFO je Aktie ist massgeblich).
      industries: []   # Erkennung ueber Industry-Praefix 'REIT - ...'
    special:
      # v35: Industry-Gruppen mit SONDERREGEL -- DCF und FCF-Yield werden
      # NICHT berechnet (MoS-Zellen "n/a (Sonderregel)", Status
      # "Sonderregel noetig"). Pattern per fnmatch auf das Industry-Feld:
      #   Banken (Banks - *, Capital Markets), Versicherer (Insurance - *),
      #   REITs (REIT - *), Versorger (Utilities - *).
      # PYPL/V/MA (Credit Services) sind NICHT dabei -> Normalmodell.
      industry_patterns:
        - "Banks - *"
        - "Capital Markets"
        - "Insurance - *"
        - "REIT - *"
        - "Utilities - *"

score_groups:
  # Quality-Score und Value-Score werden getrennt berechnet (gewichtete Summe
  # der Block-Scores je Gruppe, renormalisiert auf die verfuegbaren Bloecke).
  # Gesamtscore = weights.quality * Quality + weights.value * Value.
  quality_blocks: [profitability, stability, cashflow, moat]
  value_blocks: [valuation]
  weights:
    quality: 0.75
    value: 0.25
  # v33: Value-Score wird als "n/a" angezeigt, wenn die Datenabdeckung darunter
  # liegt (zu wenige bewertete Kriterien -> Value-Aussage nicht belastbar)
  min_coverage_value: 0.70
  # v35: Quality-Score wird als "n/a" angezeigt, wenn die Datenabdeckung
  # darunter liegt (z. B. Sektor-Sonderregel: nicht anwendbare Kriterien n/a)
  min_coverage_quality: 0.70

sanity:
  # Plausibilitaetsgrenzen [min, max] fuer den Sanity-Check (Log-Markierung).
  # Ratios dimensionslos; markt_cap_over_revenue ist eine Quercheck, der
  # Misch-Einheiten (Skalenfehler wie z. B. Mio. vs. absolut, Faktor 1e6)
  # zwischen mktCap und den Statements erwischt.
  fcf_yield: [-0.50, 0.50]
  roic: [-1.0, 5.0]           # >100 % moeglich bei negativer Nettoverschuldung (z. B. AAPL)
  roe: [-2.0, 2.0]
  net_debt_ebitda: [-10.0, 50.0]
  interest_coverage: [-100.0, 1000.0]
  ev_ebit: [0.0, 200.0]
  gross_margin: [-1.0, 1.5]
  fcf_margin: [-1.0, 1.0]
  revenue_cagr: [-0.9, 3.0]
  market_cap_over_revenue: [0.01, 1000.0]

dcf:
  # Innerer Wert (DCF, 3 Szenarien). Basis: normalisierter FCF nach SBC
  # (Ø FCF - Aktienverguetung der letzten 3 Jahre). Wachstum Jahre 1-5:
  # Bear 0 %, Base = min(Umsatz-CAGR, base_growth_cap),
  # Bull = min(CAGR x bull_growth_multiplier, bull_growth_cap);
  # Jahre 6-10 linear auf terminal_growth (fade_to_growth).
  discount_rate: 0.09
  discount_rate_cyclicals: 0.10
  terminal_growth: 0.025
  base_growth_cap: 0.06
  bull_growth_multiplier: 1.3
  bull_growth_cap: 0.10
  # v37 (1): Szenario-Wachstum bei CAGR < 0 (schrumpfendes Unternehmen):
  #   Base = CAGR (negativ, unbegrenzt), Bear = CAGR - bear_negative_spread,
  #   Bull = 0 % (keine Erholung). Bei CAGR >= 0 unveraendert:
  #   Bear 0 %, Base = min(CAGR, base_growth_cap), Bull = min(CAGR*mult, bull_growth_cap).
  bear_negative_spread: 0.03  # 3 Prozentpunkte unter Base bei CAGR < 0
  fade_to_growth: 0.025
  fcf_avg_years: 3
  fcf_mode: auto              # DCF-Startwert: auto (TTM falls plausibel, sonst O3J)
                              # | avg3 (O letzte 3 GJ) | latest (juengstes GJ)
                              # | ttm (TTM O: TTM + 2 nicht ueberlappende GJ)
                              # | ttm_only (reiner TTM-Start, ohne O)
  net_debt_mode: reported     # Nettoverschuldung: reported (gemeldet) |
                              # incl_sti (Schulden - (Cash + kurzfr. Anlagen))
  mos_min_mode: min           # Kandidatenregel MoS: min (Minimum der 4 Startwert-MoS)
                              # | avg3 | latest | ttm | ttm_only | auto (wie fcf_mode)
  # v30: welche Modi die Kandidatenregel nutzt (Status-Spalten nebeneinander):
  #   min_all     = Minimum aus allen 4 Modi (O3J, juengstes GJ, TTM O, TTM) -- Default
  #   min_recent2 = Minimum aus den juengsten 2 Modi (juengstes GJ + TTM rein)
  candidate_mode: min_all
  # v36 (4): Robustheits-MoS -- Base-Szenario mit erhoehtem Diskontsatz
  # (Default 10 %) im aktiven Startwert-Modus; Spalte "MoS bei 10 %" und
  # Status-Zusatz "robust", wenn dort >= buy_margin_of_safety_min.
  robust_discount_rate: 0.10
  buy_quality_min: 60         # Kaufkandidat: Quality-Score >= 60 (statt Gesamtscore)
  buy_margin_of_safety_min: 0.30
  buy_bear_floor: 0.80
  watch_margin_of_safety_min: 0.30  # Beobachtungsliste: bester Modus >= 30 %,
                                    # obwohl das Minimum < 30 % (Quality >= 60)

sec:
  # SEC-EDGAR-Abgleich (kostenlos, data.sec.gov). User-Agent MIT E-Mail als
  # Platzhalter -- vor Produktivbetrieb eigene E-Mail eintragen (SEC-Policy).
  user_agent: "Value-Screener research@example.com"
  enabled: true               # false = Abgleich deaktivieren
  tolerance: 0.05             # Flag "Quellen weichen ab" ab > 5 % Abweichung je Jahr
  max_requests_per_second: 5  # v32: Rate-Limit gegen data.sec.gov (SEC-Policy: max. 10/s,
                              # wir bleiben bei 5/s; Mindestabstand 1/5 s zwischen Requests)
  # v36 (2): Capex-Definitionspruefung -- weicht Capex laut SEC in mind. N Jahren
  # um mehr als `tolerance` ab -> Status "Pruefen (Capex-Definition)", nie Kandidat.
  capex_check:
    # v37 (3): Pruefstatus, wenn |Yahoo-Capex - SEC-Capex| in mind. min_years
    # Jahren mehr als `ocf_share` des OCF betraegt (nicht mehr rel. Abweichung).
    ocf_share: 0.10           # Differenz > 10 % des OCF je Jahr
    min_years: 2              # in mind. 2 betroffenen Jahren -> Pruefstatus

consistency:
  # v36 (5): Bilanz-Konsistenz -- Flag "ND != Schulden - Cash", wenn die gemeldete
  # Nettoverschuldung um mehr als `net_debt_mcap_share` der Marktkapitalisierung
  # von (Total Debt - Cash) abweicht (neuestes Jahr mit allen drei Werten).
  net_debt_mcap_share: 0.05   # 5 % der Marktkapitalisierung

universe:
  # v28 (Schritt 8): Universumslader.
  # sp500: Liste von der Wikipedia-Tabelle (pandas.read_html), wird als
  #        tickers_sp500.csv gespeichert und von dort geladen.
  # stoxx600: Import per CSV (tickers_stoxx600.csv, Spalte 'ticker').
  sp500_wikipedia_url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  sp500_csv: "tickers_sp500.csv"
  stoxx600_csv: "tickers_stoxx600.csv"
  batch_size: 20              # Abruf in Batches (z. B. 20 Ticker)
  batch_pause_seconds: 2.0    # Pause zwischen Batches (yfinance-Rate-Limit)
  resume: true                # Wiederaufnahme nach Abbruch (Cache-Datei)
  cache_file: ".universe_cache.json"  # Fortschritt je Ticker (OK/Fehler)
